name: defendepramim
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  
  flutter_riverpod: ^2.5.1
  mask_text_input_formatter: ^2.5.0
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  firebase_messaging: ^15.2.10
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_sign_in: ^6.1.4
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  firebase_crashlytics: ^4.3.10
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" 
  adaptive_icon_background: "#1E1E1E" 
  adaptive_icon_foreground: "assets/logo2.png" 

flutter:
  uses-material-design: true

  assets:
    - assets/
  
  fonts:
    - family: MapaIcons
      fonts:
        - asset: assets/fonts/MapaIcons.ttf